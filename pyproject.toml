[project]
name = "intern-decision-0-8b-onnx-cpu"
version = "0.1.0"
description = "Intern-Decision-0.8B (typed decisions, text and images) with onnxruntime + numpy only: no torch, no transformers. CPU, and GPU when onnxruntime-gpu is installed"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Runtime. That is the whole list. pillow is only imported when a request carries images.
dependencies = [
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
# Only for the oracle gate in verify/check_tokenizer_fuzz.py. Never imported at runtime.
verify = [
    "tokenizers>=0.20",
]
# Only for demo_inference_webcam.py (camera capture and the live window). Never imported by intern_decide.
webcam = [
    "opencv-python>=4.8",
]
# Only for export/ and the oracle gates in verify/ that need the reference model. Never imported at runtime.
export = [
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.14",
    "onnx>=1.17",
    "onnxscript>=0.1",
    "tokenizers>=0.20",
]

# Not a package to build: the code is run from the checkout (`uv run demo_inference_text.py`).
[tool.uv]
package = false
